<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SHOHIN MOVIE</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SHOHIN BRAND COLORS — НЕ МЕНЯТЬ -->

  <!-- =========================
       HEADER
  ========================== -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-mark">SH</div>

      <div class="brand-text">
        <div class="brand-name">SHOHIN</div>
        <div class="brand-subtitle">MOVIE</div>
      </div>
    </div>

    <div class="top-actions">

      <button
        id="searchButton"
        class="icon-button"
        type="button"
        aria-label="Поиск">
        <span>⌕</span>
      </button>

      <button
        id="menuButton"
        class="icon-button"
        type="button"
        aria-label="Меню">
        <span class="menu-lines">
          <i></i>
          <i></i>
          <i></i>
        </span>
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->
  <main id="mainView">

    <div class="main-container">

      <!-- SEARCH -->
      <section id="searchPanel" class="search-panel">

        <div class="search-box">

          <span class="search-symbol">⌕</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Поиск фильмов и сериалов..."
            autocomplete="off">

          <button
            id="closeSearch"
            type="button"
            class="search-close"
            aria-label="Закрыть поиск">
            ×
          </button>

        </div>

      </section>


      <!-- MOVIES / SERIES -->
      <nav class="type-navigation">

        <button
          class="nav-button active"
          data-type="movies"
          type="button">
          Фильмы
        </button>

        <button
          class="nav-button"
          data-type="series"
          type="button">
          Сериалы
        </button>

      </nav>


      <!-- CARDS -->
      <section
        id="movieGrid"
        class="movie-grid">
      </section>


      <!-- EMPTY -->
      <section
        id="emptyState"
        class="empty-state"
        hidden>

        <div class="empty-icon">◌</div>

        <h2>Ничего не найдено</h2>

        <p>
          Попробуйте изменить запрос.
        </p>

      </section>

    </div>

  </main>


  <!-- =========================
       MENU VIEW
  ========================== -->
  <section
    id="menuView"
    class="menu-view">

    <div class="menu-view-header">

      <button
        id="menuBack"
        class="menu-back"
        type="button">
        ←
      </button>

      <h2 id="menuViewTitle">
        Раздел
      </h2>

    </div>

    <div
      id="menuViewContent"
      class="menu-view-content">
    </div>

  </section>


  <!-- =========================
       SIDE MENU
  ========================== -->
  <aside id="sideMenu">

    <div class="side-menu-header">

      <div class="side-menu-brand">
        <div class="side-menu-logo">SH</div>

        <div>
          <strong>SHOHIN</strong>
          <span>MOVIE</span>
        </div>
      </div>

      <button
        id="menuClose"
        class="menu-close"
        type="button"
        aria-label="Закрыть">
        ×
      </button>

    </div>


    <nav class="side-menu-list">

      <button
        class="side-menu-item"
        data-section="home"
        type="button">
        <span>Главная</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="movies"
        type="button">
        <span>Фильмы</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="series"
        type="button">
        <span>Сериалы</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="countries"
        type="button">
        <span>Страны</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="genres"
        type="button">
        <span>Жанры</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="years"
        type="button">
        <span>По годам</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="rating"
        type="button">
        <span>Рейтинг</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="favorites"
        type="button">
        <span>Избранное</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="recent"
        type="button">
        <span>Недавно открытые</span>
        <b>›</b>
      </button>

      <button
        class="side-menu-item"
        data-section="about"
        type="button">
        <span>О SHOHIN MOVIE</span>
        <b>›</b>
      </button>

    </nav>

  </aside>


  <!-- MENU OVERLAY -->
  <div id="menuOverlay"></div>


  <!-- =========================
       MOVIE MODAL
  ========================== -->
  <div
    id="movieModal"
    class="movie-modal"
    aria-hidden="true">

    <div
      id="modalOverlay"
      class="modal-overlay">
    </div>

    <div class="modal-content">

      <button
        id="modalClose"
        class="modal-close"
        type="button"
        aria-label="Закрыть">
        ×
      </button>


      <div class="modal-body">

        <div class="modal-poster-wrap">

          <img
            id="modalPoster"
            class="modal-poster"
            src=""
            alt="">

        </div>


        <div class="modal-info">

          <div
            id="modalYear"
            class="modal-year">
          </div>

          <h2
            id="modalTitle"
            class="modal-title">
          </h2>


          <div
            id="modalRating"
            class="modal-rating">
          </div>


          <!-- FAVORITE -->
          <button
            id="favoriteButton"
            class="favorite-button"
            type="button"
            aria-label="Добавить в избранное">

            <span class="favorite-icon">🔖</span>
            <span class="favorite-text">Сохранить</span>

          </button>


          <div
            id="modalCountry"
            class="modal-country">
          </div>

          <div
            id="modalGenres"
            class="modal-genres">
          </div>

        </div>

      </div>


      <div
        id="modalDescription"
        class="modal-description">
      </div>

    </div>

  </div>


  <!-- =========================
       LOADING
  ========================== -->
  <div
    id="loading"
    class="loading">

    <div class="loading-spinner"></div>

    <span>Загрузка...</span>

  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->
  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>


  <!-- =========================
       MENU SYSTEM
  ========================== -->
  <script>

    function openMenu() {

      const sideMenu = document.getElementById("sideMenu");
      const menuOverlay = document.getElementById("menuOverlay");

      if (sideMenu) {
        sideMenu.classList.add("show");
      }

      if (menuOverlay) {
        menuOverlay.classList.add("show");
      }

      document.body.classList.add("menu-open");
    }


    function closeMenu() {

      const sideMenu = document.getElementById("sideMenu");
      const menuOverlay = document.getElementById("menuOverlay");

      if (sideMenu) {
        sideMenu.classList.remove("show");
      }

      if (menuOverlay) {
        menuOverlay.classList.remove("show");
      }

      document.body.classList.remove("menu-open");
    }


    function showMain() {

      const mainView = document.getElementById("mainView");
      const menuView = document.getElementById("menuView");

      if (mainView) {
        mainView.style.display = "";
      }

      if (menuView) {
        menuView.classList.remove("show");
      }

    }


    function showMenuView(title) {

      const mainView = document.getElementById("mainView");
      const menuView = document.getElementById("menuView");
      const titleElement = document.getElementById("menuViewTitle");

      if (mainView) {
        mainView.style.display = "none";
      }

      if (menuView) {
        menuView.classList.add("show");
      }

      if (titleElement) {
        titleElement.textContent = title || "Раздел";
      }

    }


    function escapeHTMLMenu(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getMenuItems() {

      if (
        typeof SHOHIN_MOVIE !== "undefined" &&
        Array.isArray(SHOHIN_MOVIE.currentItems)
      ) {
        return SHOHIN_MOVIE.currentItems;
      }

      return [];

    }


    function renderSimpleList(items, emptyText) {

      const content =
        document.getElementById("menuViewContent");

      if (!content) return;

      if (!items || !items.length) {

        content.innerHTML = `
          <div class="menu-empty">
            ${escapeHTMLMenu(emptyText || "Пока здесь ничего нет.")}
          </div>
        `;

        return;
      }


      content.innerHTML = `
        <div class="menu-list">

          ${items.map(item => `
            <button
              class="menu-list-item"
              type="button"
              data-value="${escapeHTMLMenu(item)}">

              <span>${escapeHTMLMenu(item)}</span>

              <b>›</b>

            </button>
          `).join("")}

        </div>
      `;


      content
        .querySelectorAll(".menu-list-item")
        .forEach(button => {

          button.addEventListener("click", () => {

            const value = button.dataset.value;

            showMain();

            setTimeout(() => {

              const input =
                document.getElementById("searchInput");

              if (input) {

                input.value = value;

                input.dispatchEvent(
                  new Event("input")
                );

              }

            }, 50);

          });

        });

    }


    function openSection(section) {

      closeMenu();

      const content =
        document.getElementById("menuViewContent");

      if (!content) return;


      /* =========================
         HOME
      ========================== */

      if (section === "home") {

        showMain();

        return;

      }


      /* =========================
         MOVIES
      ========================== */

      if (section === "movies") {

        showMain();

        const button =
          document.querySelector(
            '.nav-button[data-type="movies"]'
          );

        if (button) {
          button.click();
        }

        return;

      }


      /* =========================
         SERIES
      ========================== */

      if (section === "series") {

        showMain();

        const button =
          document.querySelector(
            '.nav-button[data-type="series"]'
          );

        if (button) {
          button.click();
        }

        return;

      }


      /* =========================
         COUNTRIES
      ========================== */

      if (section === "countries") {

        showMenuView("Страны");

        let countries = [];

        if (
          typeof getAllCountries === "function"
        ) {
          countries = getAllCountries();
        }

        renderSimpleList(
          countries,
          "Страны пока не загружены."
        );

        return;

      }


      /* =========================
         GENRES
      ========================== */

      if (section === "genres") {

        showMenuView("Жанры");

        let genres = [];

        if (
          typeof getAllGenres === "function"
        ) {
          genres = getAllGenres();
        }

        renderSimpleList(
          genres,
          "Жанры пока не загружены."
        );

        return;

      }


      /* =========================
         YEARS
      ========================== */

      if (section === "years") {

        showMenuView("По годам");

        const items = getMenuItems();

        const years =
          typeof getAvailableYears === "function"
            ? getAvailableYears(items)
            : [];

        renderSimpleList(
          years,
          "Годы пока не загружены."
        );

        return;

      }


      /* =========================
         RATING
      ========================== */

      if (section === "rating") {

        showMenuView("Рейтинг");

        const items =
          typeof sortByRating === "function"
            ? sortByRating(getMenuItems()).slice(0, 10)
            : [];

        if (!items.length) {

          content.innerHTML = `
            <div class="menu-empty">
              Рейтинг пока пуст.
            </div>
          `;

          return;

        }


        content.innerHTML = `
          <div class="menu-ranking">

            ${items.map((item, index) => `

              <button
                class="ranking-item"
                type="button"
                data-id="${escapeHTMLMenu(item.id)}">

                <span class="ranking-number">
                  ${index + 1}
                </span>

                <span class="ranking-title">
                  ${escapeHTMLMenu(item.title)}
                </span>

                <strong>
                  ${Number(item.rating || 0).toFixed(1)}
                </strong>

              </button>

            `).join("")}

          </div>
        `;


        content
          .querySelectorAll(".ranking-item")
          .forEach(button => {

            button.addEventListener("click", () => {

              const id = button.dataset.id;

              const item =
                getMenuItems().find(
                  movie => String(movie.id) === String(id)
                );

              if (item && typeof openMovieModal === "function") {

                openMovieModal(item);

              }

            });

          });

        return;

      }


      /* =========================
         FAVORITES
      ========================== */

      if (section === "favorites") {

        showMenuView("Избранное");

        const favorites =
          typeof getFavorites === "function"
            ? getFavorites()
            : [];


        if (!favorites.length) {

          content.innerHTML = `
            <div class="menu-empty">

              <div class="menu-empty-icon">
                🔖
              </div>

              <h3>
                Избранное пусто
              </h3>

              <p>
                Откройте фильм и нажмите
                «Сохранить», чтобы добавить его сюда.
              </p>

            </div>
          `;

          return;

        }


        content.innerHTML = `
          <div
            id="favoritesGrid"
            class="movie-grid favorites-grid">
          </div>
        `;


        const grid =
          document.getElementById("favoritesGrid");

        if (!grid) return;


        favorites.forEach(item => {

          if (
            typeof createMovieCard === "function"
          ) {

            const card =
              createMovieCard(item);

            if (card) {
              grid.appendChild(card);
            }

          }

        });

        return;

      }


      /* =========================
         RECENT
      ========================== */

      if (section === "recent") {

        showMenuView("Недавно открытые");

        let recent = [];

        try {

          recent =
            JSON.parse(
              localStorage.getItem(
                "SHOHIN_MOVIE_RECENT"
              ) || "[]"
            );

        } catch (error) {

          recent = [];

        }


        recent = recent.slice(0, 10);


        if (!recent.length) {

          content.innerHTML = `
            <div class="menu-empty">

              <div class="menu-empty-icon">
                ◷
              </div>

              <h3>
                История пуста
              </h3>

              <p>
                Здесь появятся фильмы и сериалы,
                которые вы открывали.
              </p>

            </div>
          `;

          return;

        }


        content.innerHTML = `
          <div
            id="recentGrid"
            class="movie-grid">
          </div>
        `;


        const grid =
          document.getElementById("recentGrid");

        recent.forEach(item => {

          if (
            typeof createMovieCard === "function"
          ) {

            const card =
              createMovieCard(item);

            if (card) {
              grid.appendChild(card);
            }

          }

        });

        return;

      }


      /* =========================
         ABOUT
      ========================== */

      if (section === "about") {

        showMenuView("О SHOHIN MOVIE");

        content.innerHTML = `

          <div class="about-content">

            <div class="about-logo">
              SH
            </div>

            <h3>
              SHOHIN MOVIE
            </h3>

            <p>
              Каталог фильмов и сериалов
              от SHOHIN.
            </p>

            <p>
              Здесь собрана информация о
              фильмах и сериалах: названия,
              годы, страны, жанры, рейтинги
              и описания.
            </p>

            <p>
              Проект развивается постепенно,
              чтобы сделать удобный и быстрый
              каталог для пользователей.
            </p>

            <div class="about-tagline">
              SHOHIN MOVIE
            </div>

          </div>

        `;

        return;

      }

    }


    /* =========================
       MENU EVENTS
    ========================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const menuButton =
          document.getElementById("menuButton");

        const menuClose =
          document.getElementById("menuClose");

        const menuOverlay =
          document.getElementById("menuOverlay");

        const menuBack =
          document.getElementById("menuBack");


        if (menuButton) {

          menuButton.addEventListener(
            "click",
            openMenu
          );

        }


        if (menuClose) {

          menuClose.addEventListener(
            "click",
            closeMenu
          );

        }


        if (menuOverlay) {

          menuOverlay.addEventListener(
            "click",
            closeMenu
          );

        }


        if (menuBack) {

          menuBack.addEventListener(
            "click",
            showMain
          );

        }


        document
          .querySelectorAll(".side-menu-item")
          .forEach(button => {

            button.addEventListener(
              "click",
              () => {

                const section =
                  button.dataset.section;

                openSection(section);

              }
            );

          });


        document.addEventListener(
          "keydown",
          event => {

            if (event.key === "Escape") {

              closeMenu();

            }

          }
        );

      }
    );

  </script>

</body>
</html>
