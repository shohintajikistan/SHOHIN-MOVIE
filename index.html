<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071c16">

  <title>SHOHIN MOVIE</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!--
    SHOHIN MOVIE
    Главный экран:
    только Header + поиск + Фильмы/Сериалы + карточки
  -->

  <!-- =========================
       LOADING
  ========================== -->

  <div id="loading" class="loading">
    <div class="loading-logo">
      <div class="loading-sh">SH</div>
      <div class="loading-name">SHOHIN</div>
    </div>
  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app" class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

      <div class="brand">
        <div class="brand-mark">SH</div>

        <div class="brand-text">
          <div class="brand-name">SHOHIN</div>
          <div class="brand-subtitle">MOVIE</div>
        </div>
      </div>


      <div class="topbar-actions">

        <!-- SEARCH -->

        <button
          id="searchButton"
          class="icon-button"
          type="button"
          aria-label="Поиск"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
        </button>


        <!-- MENU -->

        <button
          id="menuButton"
          class="icon-button"
          type="button"
          aria-label="Меню"
        >
          <svg
            viewBox="0 0 24 24"
            width="23"
            height="23"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        </button>

      </div>

    </header>


    <!-- =========================
         SEARCH PANEL
    ========================== -->

    <section
      id="searchPanel"
      class="search-panel"
      aria-hidden="true"
    >

      <div class="search-panel-inner">

        <div class="search-input-wrap">

          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>

          <input
            id="searchInput"
            type="search"
            placeholder="Найти фильм или сериал..."
            autocomplete="off"
            spellcheck="false"
          >

          <button
            id="closeSearch"
            class="search-close"
            type="button"
            aria-label="Закрыть поиск"
          >
            ×
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-content">

      <!--
        Только два типа контента.
        Никаких стран, жанров, годов и рейтингов
        на главном экране.
      -->

      <nav class="type-navigation" aria-label="Тип контента">

        <button
          class="nav-button active"
          data-type="movies"
          type="button"
        >
          Фильмы
        </button>

        <button
          class="nav-button"
          data-type="series"
          type="button"
        >
          Сериалы
        </button>

      </nav>


      <!-- =========================
           CATALOG
      ========================== -->

      <section class="catalog-section">

        <!--
          Скрытые служебные элементы.
          app.js использует их для информации о каталоге.
        -->

        <div class="catalog-header">

          <h1 id="catalogTitle">Фильмы 1980</h1>

          <span id="catalogCount"></span>

        </div>


        <!-- CARDS -->

        <div
          id="movieGrid"
          class="movie-grid"
        ></div>


        <!-- EMPTY -->

        <div
          id="emptyState"
          class="empty-state"
        >

          <div class="empty-icon">

            <svg
              viewBox="0 0 24 24"
              width="42"
              height="42"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="4"
                width="18"
                height="16"
                rx="2"
              ></rect>

              <path d="M8 4v16"></path>
              <path d="M16 4v16"></path>

              <path d="M3 9h5"></path>
              <path d="M16 9h5"></path>

              <path d="M3 15h5"></path>
              <path d="M16 15h5"></path>
            </svg>

          </div>

          <h2>Каталог пуст</h2>

          <p>
            Здесь появятся фильмы и сериалы.
          </p>

        </div>

      </section>

    </main>


    <!-- =========================
         SIDE MENU
    ========================== -->

    <div
      id="menuOverlay"
      class="menu-overlay"
    ></div>


    <aside
      id="sideMenu"
      class="side-menu"
      aria-hidden="true"
    >

      <!-- MENU HEADER -->

      <div class="side-menu-header">

        <div class="side-menu-brand">

          <div class="side-menu-mark">
            SH
          </div>

          <div>
            <div class="side-menu-title">
              SHOHIN
            </div>

            <div class="side-menu-subtitle">
              MOVIE
            </div>
          </div>

        </div>


        <button
          id="menuClose"
          class="menu-close"
          type="button"
          aria-label="Закрыть меню"
        >
          ×
        </button>

      </div>


      <!-- MENU -->

      <nav class="side-menu-nav">

        <!-- HOME -->

        <button
          class="menu-item active"
          data-menu="home"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 11.5L12 4l9 7.5"></path>
              <path d="M5 10v10h14V10"></path>
            </svg>

          </span>

          <span>Главная</span>

        </button>


        <!-- MOVIES -->

        <button
          class="menu-item"
          data-menu="movies"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="4"
                width="18"
                height="16"
                rx="2"
              ></rect>

              <path d="M8 4v16"></path>
              <path d="M16 4v16"></path>
              <path d="M3 9h5"></path>
              <path d="M16 9h5"></path>
              <path d="M3 15h5"></path>
              <path d="M16 15h5"></path>
            </svg>

          </span>

          <span>Фильмы</span>

        </button>


        <!-- SERIES -->

        <button
          class="menu-item"
          data-menu="series"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path d="M8 5l2-3"></path>
              <path d="M16 5l2-3"></path>

              <path d="M8 12h.01"></path>
              <path d="M12 12h.01"></path>
              <path d="M16 12h.01"></path>
            </svg>

          </span>

          <span>Сериалы</span>

        </button>


        <div class="menu-divider"></div>


        <!-- COUNTRIES -->

        <button
          class="menu-item"
          data-menu="countries"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path d="M3 12h18"></path>
              <path d="M12 3c3 3 3 15 0 18"></path>
              <path d="M12 3c-3 3-3 15 0 18"></path>
            </svg>

          </span>

          <span>Страны</span>

        </button>


        <!-- GENRES -->

        <button
          class="menu-item"
          data-menu="genres"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h16"></path>

              <circle
                cx="9"
                cy="6"
                r="2"
              ></circle>

              <circle
                cx="15"
                cy="12"
                r="2"
              ></circle>

              <circle
                cx="10"
                cy="18"
                r="2"
              ></circle>
            </svg>

          </span>

          <span>Жанры</span>

        </button>


        <!-- YEARS -->

        <button
          class="menu-item"
          data-menu="years"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="16"
                rx="2"
              ></rect>

              <path d="M7 3v4"></path>
              <path d="M17 3v4"></path>
              <path d="M3 10h18"></path>

              <path d="M8 14h2"></path>
              <path d="M14 14h2"></path>
              <path d="M8 18h2"></path>
              <path d="M14 18h2"></path>
            </svg>

          </span>

          <span>По годам</span>

        </button>


        <!-- RATING -->

        <button
          class="menu-item"
          data-menu="rating"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3z"
              ></path>
            </svg>

          </span>

          <span>Рейтинг</span>

        </button>


        <div class="menu-divider"></div>


        <!-- FAVORITES -->

        <button
          class="menu-item"
          data-menu="favorites"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 8.7c0 5-8.8 10.2-8.8 10.2S3.2 13.7 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3z"
              ></path>
            </svg>

          </span>

          <span>Избранное</span>

        </button>


        <!-- RECENT -->

        <button
          class="menu-item"
          data-menu="recent"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path d="M12 7v5l3 2"></path>
            </svg>

          </span>

          <span>Недавно открытые</span>

        </button>


        <div class="menu-divider"></div>


        <!-- ABOUT -->

        <button
          class="menu-item"
          data-menu="about"
          type="button"
        >

          <span class="menu-item-icon">

            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path d="M12 10v6"></path>
              <path d="M12 7h.01"></path>
            </svg>

          </span>

          <span>О SHOHIN MOVIE</span>

        </button>

      </nav>


      <!-- MENU FOOTER -->

      <div class="side-menu-footer">

        <div class="side-menu-line"></div>

        <div class="side-menu-footer-text">
          SHOHIN MOVIE
        </div>

        <div class="side-menu-footer-small">
          Learn. Discover. Enjoy.
        </div>

      </div>

    </aside>


    <!-- =========================
         MOVIE MODAL
    ========================== -->

    <div
      id="movieModal"
      class="movie-modal"
      aria-hidden="true"
    >

      <div
        id="modalOverlay"
        class="modal-overlay"
      ></div>


      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
      >

        <button
          id="modalClose"
          class="modal-close"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>


        <div class="modal-poster-wrap">

          <img
            id="modalPoster"
            class="modal-poster"
            src=""
            alt=""
          >

        </div>


        <div class="modal-info">

          <div
            id="modalYear"
            class="modal-year"
          ></div>


          <h2
            id="modalTitle"
            class="modal-title"
          ></h2>


          <div
            id="modalRating"
            class="modal-rating"
          ></div>


          <div
            id="modalCountry"
            class="modal-country"
          ></div>


          <div
            id="modalGenres"
            class="modal-genres"
          ></div>


          <p
            id="modalDescription"
            class="modal-description"
          ></p>

        </div>

      </div>

    </div>


    <!-- =========================
         HIDDEN COMPATIBILITY
         FOR EXISTING APP.JS
    ========================== -->

    <div
      id="yearMenu"
      style="display:none;"
      aria-hidden="true"
    >

      <button
        type="button"
        data-year="1980"
      >
        1980
      </button>

    </div>

    <button
      id="yearButton"
      type="button"
      style="display:none;"
    >
      1980
    </button>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>


  <!-- =========================
       MENU SCRIPT
  ========================== -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const menuButton =
        document.getElementById("menuButton");

      const menuClose =
        document.getElementById("menuClose");

      const sideMenu =
        document.getElementById("sideMenu");

      const menuOverlay =
        document.getElementById("menuOverlay");

      const menuItems =
        document.querySelectorAll(".menu-item");


      function openMenu() {

        if (!sideMenu || !menuOverlay) return;

        sideMenu.classList.add("show");
        menuOverlay.classList.add("show");

        sideMenu.setAttribute(
          "aria-hidden",
          "false"
        );

        document.body.classList.add(
          "menu-open"
        );
      }


      function closeMenu() {

        if (!sideMenu || !menuOverlay) return;

        sideMenu.classList.remove("show");
        menuOverlay.classList.remove("show");

        sideMenu.setAttribute(
          "aria-hidden",
          "true"
        );

        document.body.classList.remove(
          "menu-open"
        );
      }


      if (menuButton) {

        menuButton.addEventListener(
          "click",
          openMenu
        );

      }


      if (menuClose) {

        menuClose.addEventListener(
          "click",
          closeMenu
        );

      }


      if (menuOverlay) {

        menuOverlay.addEventListener(
          "click",
          closeMenu
        );

      }


      menuItems.forEach(item => {

        item.addEventListener(
          "click",
          () => {

            const menu =
              item.dataset.menu;

            /*
              Главная / Фильмы / Сериалы
              работают сразу.
            */

            if (menu === "home") {

              closeMenu();

              window.scrollTo({
                top: 0,
                behavior: "smooth"
              });

              return;

            }


            if (menu === "movies") {

              const button =
                document.querySelector(
                  '.nav-button[data-type="movies"]'
                );

              if (button) {
                button.click();
              }

              closeMenu();
              return;

            }


            if (menu === "series") {

              const button =
                document.querySelector(
                  '.nav-button[data-type="series"]'
                );

              if (button) {
                button.click();
              }

              closeMenu();
              return;

            }


            /*
              Остальные разделы пока подготовлены
              в меню.

              Логику стран, жанров, годов,
              рейтинга, избранного и истории
              подключим следующим этапом.
            */

            closeMenu();

          }
        );

      });


      /*
        ESC — закрыть меню
      */

      document.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Escape" &&
            sideMenu &&
            sideMenu.classList.contains("show")
          ) {

            closeMenu();

          }

        }
      );

    });

  </script>

</body>
</html>
