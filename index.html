<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SHOHIN MOVIE</title>

  <meta name="description" content="SHOHIN MOVIE — каталог фильмов и сериалов.">
  <meta name="theme-color" content="#071c16">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-logo">SH</div>

      <div class="brand-text">
        <strong>SHOHIN</strong>
        <span>MOVIE</span>
      </div>
    </div>

    <button class="search-button" id="searchButton" aria-label="Поиск">
      <span>⌕</span>
    </button>

  </header>


  <!-- SEARCH -->
  <section class="search-panel" id="searchPanel">

    <div class="search-box">
      <span>⌕</span>

      <input
        type="search"
        id="searchInput"
        placeholder="Поиск фильма..."
        autocomplete="off"
      >

      <button id="closeSearch" aria-label="Закрыть">×</button>
    </div>

  </section>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <span class="hero-label">SHOHIN MOVIE</span>

      <h1>Мир кино<br>в одном месте</h1>

      <p>
        Фильмы и сериалы по годам,
        жанрам и рейтингу.
      </p>

    </div>

  </section>


  <!-- NAVIGATION -->
  <nav class="main-nav">

    <button class="nav-button active" data-type="movies">
      Фильмы
    </button>

    <button class="nav-button" data-type="series">
      Сериалы
    </button>

  </nav>


  <!-- FILTERS -->
  <section class="filters">

    <button class="filter-button active" data-filter="all">
      Все
    </button>

    <button class="filter-button" data-filter="new">
      Новые
    </button>

    <button class="filter-button" data-filter="rating">
      Рейтинг
    </button>

  </section>


  <!-- YEAR -->
  <section class="year-section">

    <div class="section-heading">

      <div>
        <span class="small-label">КАТАЛОГ</span>
        <h2 id="catalogTitle">Фильмы 1980</h2>
      </div>

      <button class="year-button" id="yearButton">
        1980
        <span>⌄</span>
      </button>

    </div>

  </section>


  <!-- YEAR MENU -->
  <div class="year-menu" id="yearMenu">

    <button data-year="1980">1980</button>
    <button data-year="1981">1981</button>
    <button data-year="1982">1982</button>
    <button data-year="1983">1983</button>
    <button data-year="1984">1984</button>
    <button data-year="1985">1985</button>
    <button data-year="1986">1986</button>
    <button data-year="1987">1987</button>
    <button data-year="1988">1988</button>
    <button data-year="1989">1989</button>
    <button data-year="1990">1990</button>

  </div>


  <!-- STATUS -->
  <section class="catalog-status">

    <span id="catalogCount">Загрузка...</span>

  </section>


  <!-- MOVIE GRID -->
  <main class="movie-grid" id="movieGrid">

    <!-- Карточки загружаются автоматически -->

  </main>


  <!-- LOADING -->
  <div class="loading" id="loading">

    <div class="loading-spinner"></div>

    <span>Загрузка каталога...</span>

  </div>


  <!-- EMPTY -->
  <div class="empty-state" id="emptyState">

    <div class="empty-icon">◌</div>

    <h3>Ничего не найдено</h3>

    <p>
      Попробуйте изменить поиск или выбрать другой год.
    </p>

  </div>


  <!-- MOVIE MODAL -->
  <div class="movie-modal" id="movieModal">

    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-card">

      <button
        class="modal-close"
        id="modalClose"
        aria-label="Закрыть"
      >
        ×
      </button>

      <div class="modal-poster-wrap">

        <img
          id="modalPoster"
          src=""
          alt=""
        >

      </div>

      <div class="modal-content">

        <span class="modal-year" id="modalYear"></span>

        <h2 id="modalTitle"></h2>

        <div class="modal-meta">

          <span id="modalRating"></span>

          <span id="modalCountry"></span>

        </div>

        <div class="modal-genres" id="modalGenres"></div>

        <p id="modalDescription"></p>

      </div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-logo">
      SHOHIN MOVIE
    </div>

    <p>
      Каталог фильмов и сериалов
    </p>

    <span>
      © 2026 SHOHIN
    </span>

  </footer>


  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
