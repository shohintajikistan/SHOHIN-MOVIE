  <!-- ==================================================
       MENU NAVIGATION
  ================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const menuButton =
          document.getElementById("menuButton");

        const menuClose =
          document.getElementById("menuClose");

        const menuOverlay =
          document.getElementById("menuOverlay");

        const sideMenu =
          document.getElementById("sideMenu");

        const menuView =
          document.getElementById("menuView");

        const menuBack =
          document.getElementById("menuBack");

        const menuViewTitle =
          document.getElementById("menuViewTitle");

        const menuViewContent =
          document.getElementById("menuViewContent");

        const mainView =
          document.getElementById("mainView");

        const menuItems =
          document.querySelectorAll(".menu-item");


        /* ==========================================
           OPEN MENU
        ========================================== */

        function openMenu() {

          sideMenu.classList.add("show");

          menuOverlay.classList.add("show");

          sideMenu.setAttribute(
            "aria-hidden",
            "false"
          );

          menuOverlay.setAttribute(
            "aria-hidden",
            "false"
          );

          menuButton.setAttribute(
            "aria-expanded",
            "true"
          );

          document.body.classList.add(
            "menu-open"
          );

        }


        /* ==========================================
           CLOSE MENU
        ========================================== */

        function closeMenu() {

          sideMenu.classList.remove("show");

          menuOverlay.classList.remove("show");

          sideMenu.setAttribute(
            "aria-hidden",
            "true"
          );

          menuOverlay.setAttribute(
            "aria-hidden",
            "true"
          );

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

          document.body.classList.remove(
            "menu-open"
          );

        }


        /* ==========================================
           OPEN MENU SECTION
        ========================================== */

        function openSection(type) {

          closeMenu();


          /*
           * Главная
           */

          if (type === "home") {

            menuView.classList.remove("show");

            mainView.style.display = "";

            return;

          }


          /*
           * Фильмы
           */

          if (type === "movies") {

            menuView.classList.remove("show");

            mainView.style.display = "";

            const movieButton =
              document.querySelector(
                '.nav-button[data-type="movies"]'
              );

            if (movieButton) {
              movieButton.click();
            }

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

            return;

          }


          /*
           * Сериалы
           */

          if (type === "series") {

            menuView.classList.remove("show");

            mainView.style.display = "";

            const seriesButton =
              document.querySelector(
                '.nav-button[data-type="series"]'
              );

            if (seriesButton) {
              seriesButton.click();
            }

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

            return;

          }


          /*
           * Остальные разделы
           */

          mainView.style.display = "none";

          menuView.classList.add("show");

          menuView.setAttribute(
            "aria-hidden",
            "false"
          );


          const titles = {

            countries: "Страны",

            genres: "Жанры",

            years: "По годам",

            rating: "Рейтинг",

            favorites: "Избранное",

            recent: "Недавно открытые",

            about: "О SHOHIN MOVIE"

          };


          menuViewTitle.textContent =
            titles[type] || "Раздел";


          renderMenuSection(type);

        }


        /* ==========================================
           RENDER MENU SECTION
        ========================================== */

        function renderMenuSection(type) {

          menuViewContent.innerHTML = "";


          /*
           * СТРАНЫ
           */

          if (type === "countries") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">🌍</div>

              <h2>Страны</h2>

              <p>
                Здесь будут все страны,
                представленные в каталоге.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * ЖАНРЫ
           */

          if (type === "genres") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">◈</div>

              <h2>Жанры</h2>

              <p>
                Здесь будут все жанры
                фильмов и сериалов.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * ГОДЫ
           */

          if (type === "years") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">▣</div>

              <h2>По годам</h2>

              <p>
                Здесь появится каталог
                по годам выпуска.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * РЕЙТИНГ
           */

          if (type === "rating") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">★</div>

              <h2>Рейтинг</h2>

              <p>
                Здесь будут фильмы и сериалы
                с сортировкой по рейтингу.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * ИЗБРАННОЕ
           */

          if (type === "favorites") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">♡</div>

              <h2>Избранное</h2>

              <p>
                Здесь будут сохранённые
                фильмы и сериалы.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * НЕДАВНО ОТКРЫТЫЕ
           */

          if (type === "recent") {

            const title =
              document.createElement("div");

            title.className =
              "menu-section-empty";

            title.innerHTML = `
              <div class="menu-section-icon">◷</div>

              <h2>Недавно открытые</h2>

              <p>
                Здесь появится история
                недавно открытых карточек.
              </p>
            `;

            menuViewContent.appendChild(title);

            return;

          }


          /*
           * О SHOHIN MOVIE
           */

          if (type === "about") {

            const about =
              document.createElement("div");

            about.className =
              "about-shohin";

            about.innerHTML = `
              <div class="about-logo">
                SH
              </div>

              <h2>
                SHOHIN MOVIE
              </h2>

              <p>
                Каталог фильмов и сериалов
                SHOHIN.
              </p>

              <p>
                Здесь пользователи смогут
                находить фильмы, сериалы,
                страны, жанры, годы и рейтинги
                в одном удобном месте.
              </p>
            `;

            menuViewContent.appendChild(
              about
            );

          }

        }


        /* ==========================================
           BACK FROM SECTION
        ========================================== */

        menuBack.addEventListener(
          "click",
          function () {

            menuView.classList.remove(
              "show"
            );

            menuView.setAttribute(
              "aria-hidden",
              "true"
            );

            mainView.style.display = "";

          }
        );


        /* ==========================================
           MENU BUTTON
        ========================================== */

        menuButton.addEventListener(
          "click",
          function () {

            if (
              sideMenu.classList.contains(
                "show"
              )
            ) {

              closeMenu();

            } else {

              openMenu();

            }

          }
        );


        /* ==========================================
           CLOSE BUTTON
        ========================================== */

        menuClose.addEventListener(
          "click",
          closeMenu
        );


        /* ==========================================
           OVERLAY
        ========================================== */

        menuOverlay.addEventListener(
          "click",
          closeMenu
        );


        /* ==========================================
           MENU ITEMS
        ========================================== */

        menuItems.forEach(
          function (item) {

            item.addEventListener(
              "click",
              function () {

                const type =
                  item.dataset.menu;

                menuItems.forEach(
                  function (button) {

                    button.classList.remove(
                      "active"
                    );

                  }
                );

                item.classList.add(
                  "active"
                );

                openSection(type);

              }
            );

          }
        );


        /* ==========================================
           ESC
        ========================================== */

        document.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Escape"
            ) {

              if (
                sideMenu.classList.contains(
                  "show"
                )
              ) {

                closeMenu();

              }

              if (
                menuView.classList.contains(
                  "show"
                )
              ) {

                menuView.classList.remove(
                  "show"
                );

                mainView.style.display =
                  "";

              }

            }

          }
        );

      });

  </script>

</body>
</html>
