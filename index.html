<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071c16"
  >

  <meta
    name="description"
    content="SHOHIN MOVIE — каталог фильмов и сериалов."
  >

  <title>SHOHIN MOVIE</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


<div id="app">


  <!-- ==================================================
       TOPBAR
  ================================================== -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-mark">
        SH
      </div>

      <div class="brand-text">

        <div class="brand-title">
          SHOHIN MOVIE
        </div>

        <div class="brand-subtitle">
          MOVIES & SERIES
        </div>

      </div>

    </div>


    <div class="top-actions">

      <button
        id="searchButton"
        class="icon-button"
        type="button"
        aria-label="Поиск"
      >
        ⌕
      </button>


      <button
        id="menuButton"
        class="icon-button"
        type="button"
        aria-label="Меню"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- ==================================================
       MAIN VIEW
  ================================================== -->

  <main id="mainView">

    <div class="main-container">


      <!-- SEARCH -->

      <div
        id="searchPanel"
        class="search-panel"
        aria-hidden="true"
      >

        <div class="search-input-wrap">

          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Найти фильм или сериал..."
            autocomplete="off"
          >

        </div>


        <button
          id="closeSearch"
          class="search-close"
          type="button"
          aria-label="Закрыть поиск"
        >
          ×
        </button>

      </div>


      <!-- FILMS / SERIES -->

      <nav
        class="type-navigation"
        aria-label="Тип"
      >

        <button
          class="nav-button active"
          data-type="movies"
          type="button"
        >
          Фильмы
        </button>


        <button
          class="nav-button"
          data-type="series"
          type="button"
        >
          Сериалы
        </button>

      </nav>


      <!-- CARDS -->

      <section
        id="movieGrid"
        class="movie-grid"
      ></section>


      <!-- EMPTY -->

      <section
        id="emptyState"
        class="empty-state"
      >

        <h3>
          Пока ничего нет
        </h3>

        <p>
          Каталог пока пуст.
        </p>

      </section>

    </div>

  </main>


  <!-- ==================================================
       MENU VIEW
  ================================================== -->

  <section
    id="menuView"
  >

    <div class="menu-view-header">

      <button
        id="menuBack"
        class="menu-back"
        type="button"
        aria-label="Назад"
      >
        ←
      </button>


      <h1 id="menuViewTitle">
        Раздел
      </h1>

    </div>


    <div id="menuViewContent"></div>

  </section>


  <!-- ==================================================
       SIDE MENU
  ================================================== -->

  <aside
    id="sideMenu"
    aria-hidden="true"
  >

    <div class="menu-header">

      <div class="menu-brand">

        <strong>
          SHOHIN MOVIE
        </strong>

        <span>
          MAIN MENU
        </span>

      </div>


      <button
        id="menuClose"
        class="menu-close"
        type="button"
        aria-label="Закрыть меню"
      >
        ×
      </button>

    </div>


    <nav class="menu-list">


      <button
        class="menu-item"
        data-section="home"
        type="button"
      >
        Главная
      </button>


      <button
        class="menu-item"
        data-section="movies"
        type="button"
      >
        Фильмы
      </button>


      <button
        class="menu-item"
        data-section="series"
        type="button"
      >
        Сериалы
      </button>


      <button
        class="menu-item"
        data-section="countries"
        type="button"
      >
        Страны
      </button>


      <button
        class="menu-item"
        data-section="genres"
        type="button"
      >
        Жанры
      </button>


      <button
        class="menu-item"
        data-section="years"
        type="button"
      >
        По годам
      </button>


      <button
        class="menu-item"
        data-section="rating"
        type="button"
      >
        Рейтинг
      </button>


      <button
        class="menu-item"
        data-section="favorites"
        type="button"
      >
        Избранное
      </button>


      <button
        class="menu-item"
        data-section="recent"
        type="button"
      >
        Недавно открытые
      </button>


      <button
        class="menu-item"
        data-section="about"
        type="button"
      >
        О SHOHIN MOVIE
      </button>


    </nav>

  </aside>


  <!-- MENU OVERLAY -->

  <div
    id="menuOverlay"
  ></div>


  <!-- ==================================================
       MOVIE MODAL
  ================================================== -->

  <div
    id="movieModal"
    aria-hidden="true"
  >

    <div
      id="modalOverlay"
    ></div>


    <div class="modal-content">


      <button
        id="modalClose"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>


      <div class="modal-body">


        <img
          id="modalPoster"
          src=""
          alt=""
        >


        <div class="modal-info">

          <div id="modalYear"></div>

          <h2 id="modalTitle">
            Без названия
          </h2>

          <div id="modalRating">
            ★ —
          </div>

          <div id="modalCountry">
            Страна не указана
          </div>

          <div id="modalGenres"></div>

        </div>

      </div>


      <div id="modalDescription">
        Описание пока не добавлено.
      </div>


    </div>

  </div>


  <!-- ==================================================
       LOADING
  ================================================== -->

  <div id="loading">

    <div class="loading-box">

      <div class="loading-spinner"></div>

    </div>

  </div>


</div>


<!-- ==================================================
     DATA / APP
================================================== -->

<script src="js/cards.js"></script>

<script src="js/filters.js"></script>

<script src="js/app.js"></script>


<!-- ==================================================
     MENU SYSTEM
================================================== -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const menuClose =
      document.getElementById(
        "menuClose"
      );

    const sideMenu =
      document.getElementById(
        "sideMenu"
      );

    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );

    const mainView =
      document.getElementById(
        "mainView"
      );

    const menuView =
      document.getElementById(
        "menuView"
      );

    const menuBack =
      document.getElementById(
        "menuBack"
      );

    const menuTitle =
      document.getElementById(
        "menuViewTitle"
      );

    const menuContent =
      document.getElementById(
        "menuViewContent"
      );


    /* ================================================
       OPEN MENU
    ================================================ */

    function openMenu() {

      sideMenu.classList.add(
        "show"
      );

      menuOverlay.classList.add(
        "show"
      );

      sideMenu.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    /* ================================================
       CLOSE MENU
    ================================================ */

    function closeMenu() {

      sideMenu.classList.remove(
        "show"
      );

      menuOverlay.classList.remove(
        "show"
      );

      sideMenu.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    /* ================================================
       SHOW MAIN
    ================================================ */

    function showMain() {

      mainView.style.display =
        "block";

      menuView.classList.remove(
        "show"
      );

    }


    /* ================================================
       SHOW MENU VIEW
    ================================================ */

    function showMenuView(
      title,
      content
    ) {

      mainView.style.display =
        "none";

      menuView.classList.add(
        "show"
      );

      menuTitle.textContent =
        title;

      menuContent.innerHTML =
        content;

    }


    /* ================================================
       MENU SECTION
    ================================================ */

    function openSection(
      section
    ) {

      closeMenu();


      /*
       * Главная
       */

      if (
        section === "home"
      ) {

        showMain();

        return;

      }


      /*
       * Фильмы
       */

      if (
        section === "movies"
      ) {

        showMain();


        const button =
          document.querySelector(
            '.nav-button[data-type="movies"]'
          );


        if (button) {

          button.click();

        }


        return;

      }


      /*
       * Сериалы
       */

      if (
        section === "series"
      ) {

        showMain();


        const button =
          document.querySelector(
            '.nav-button[data-type="series"]'
          );


        if (button) {

          button.click();

        }


        return;

      }


      /* ============================================
         СТРАНЫ
      ============================================ */

      if (
        section === "countries"
      ) {

        const countries =
          typeof getAllCountries ===
          "function"
            ? getAllCountries()
            : [];


        if (!countries.length) {

          showMenuView(
            "Страны",
            `
              <div class="menu-section-empty">

                <h3>
                  Страны
                </h3>

                <p>
                  Страны появятся автоматически
                  после добавления фильмов
                  в каталог.
                </p>

              </div>
            `
          );

          return;

        }


        showMenuView(
          "Страны",
          `
            <div class="menu-section-empty">

              <h3>
                Доступные страны
              </h3>

              <p>
                ${countries
                  .map(
                    country =>
                      `<span>${escapeHTML(country)}</span>`
                  )
                  .join(" • ")}
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         ЖАНРЫ
      ============================================ */

      if (
        section === "genres"
      ) {

        const genres =
          typeof getAllGenres ===
          "function"
            ? getAllGenres()
            : [];


        if (!genres.length) {

          showMenuView(
            "Жанры",
            `
              <div class="menu-section-empty">

                <h3>
                  Жанры
                </h3>

                <p>
                  Жанры появятся автоматически
                  после добавления фильмов
                  в каталог.
                </p>

              </div>
            `
          );

          return;

        }


        showMenuView(
          "Жанры",
          `
            <div class="menu-section-empty">

              <h3>
                Доступные жанры
              </h3>

              <p>
                ${genres
                  .map(
                    genre =>
                      `<span>${escapeHTML(genre)}</span>`
                  )
                  .join(" • ")}
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         ПО ГОДАМ
      ============================================ */

      if (
        section === "years"
      ) {

        const items =
          SHOHIN_MOVIE.currentItems ||
          [];


        const years =
          typeof getAvailableYears ===
          "function"
            ? getAvailableYears(items)
            : [];


        showMenuView(
          "По годам",
          `
            <div class="menu-section-empty">

              <h3>
                Годы каталога
              </h3>

              <p>
                ${
                  years.length
                    ? years.join(" • ")
                    : "Годы появятся после добавления каталога."
                }
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         РЕЙТИНГ
      ============================================ */

      if (
        section === "rating"
      ) {

        const items =
          SHOHIN_MOVIE.currentItems ||
          [];


        const sorted =
          typeof sortByRating ===
          "function"
            ? sortByRating(items)
            : [];


        const top =
          sorted.slice(
            0,
            10
          );


        if (!top.length) {

          showMenuView(
            "Рейтинг",
            `
              <div class="menu-section-empty">

                <h3>
                  Рейтинг
                </h3>

                <p>
                  Фильмы с рейтингом появятся
                  после добавления каталога.
                </p>

              </div>
            `
          );

          return;

        }


        showMenuView(
          "Рейтинг",
          `
            <div class="menu-section-empty">

              <h3>
                Лучшие фильмы
              </h3>

              <p>
                ${top
                  .map(
                    (item, index) =>
                      `${index + 1}. ${escapeHTML(item.title || "Без названия")} — ★ ${Number(item.rating || 0).toFixed(1)}`
                  )
                  .join("<br><br>")}
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         ИЗБРАННОЕ
      ============================================ */

      if (
        section === "favorites"
      ) {

        showMenuView(
          "Избранное",
          `
            <div class="menu-section-empty">

              <h3>
                Избранное
              </h3>

              <p>
                Раздел подготовлен.
                Систему добавления фильмов
                в избранное подключим следующим
                этапом.
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         НЕДАВНО ОТКРЫТЫЕ
      ============================================ */

      if (
        section === "recent"
      ) {

        let recent = [];


        try {

          recent =
            JSON.parse(
              localStorage.getItem(
                "SHOHIN_MOVIE_RECENT"
              ) || "[]"
            );

        } catch (
          error
        ) {

          recent = [];

        }


        if (!recent.length) {

          showMenuView(
            "Недавно открытые",
            `
              <div class="menu-section-empty">

                <h3>
                  Пока пусто
                </h3>

                <p>
                  Открой любой фильм —
                  он появится здесь.
                </p>

              </div>
            `
          );

          return;

        }


        showMenuView(
          "Недавно открытые",
          `
            <div class="menu-section-empty">

              <h3>
                Последние фильмы
              </h3>

              <p>
                ${recent
                  .slice(0, 10)
                  .map(
                    item =>
                      `${escapeHTML(item.title || "Без названия")} — ${escapeHTML(item.year || "")}`
                  )
                  .join("<br><br>")}
              </p>

            </div>
          `
        );

        return;

      }


      /* ============================================
         О SHOHIN MOVIE
      ============================================ */

      if (
        section === "about"
      ) {

        showMenuView(
          "О SHOHIN MOVIE",
          `
            <div class="about-shohin">

              <h2>
                SHOHIN MOVIE
              </h2>

              <p>
                Каталог фильмов и сериалов
                SHOHIN.
              </p>

              <p>
                Здесь можно находить фильмы,
                смотреть информацию о них,
                искать по каталогу и
                постепенно расширять
                коллекцию.
              </p>

              <p>
                SHOHIN MOVIE создан как
                простой и удобный каталог
                без лишних элементов
                на главном экране.
              </p>

            </div>
          `
        );

      }

    }


    /* ================================================
       MENU BUTTON
    ================================================ */

    if (menuButton) {

      menuButton.addEventListener(
        "click",
        openMenu
      );

    }


    /* ================================================
       CLOSE BUTTON
    ================================================ */

    if (menuClose) {

      menuClose.addEventListener(
        "click",
        closeMenu
      );

    }


    /* ================================================
       OVERLAY
    ================================================ */

    if (menuOverlay) {

      menuOverlay.addEventListener(
        "click",
        closeMenu
      );

    }


    /* ================================================
       MENU ITEMS
    ================================================ */

    document
      .querySelectorAll(
        ".menu-item"
      )
      .forEach(
        item => {

          item.addEventListener(
            "click",
            () => {

              openSection(
                item.dataset.section
              );

            }
          );

        }
      );


    /* ================================================
       BACK
    ================================================ */

    if (menuBack) {

      menuBack.addEventListener(
        "click",
        showMain
      );

    }


    /* ================================================
       ESC
    ================================================ */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeMenu();

          showMain();

        }

      }
    );

  }
);


/* ==================================================
   SAFE HTML FOR MENU
================================================== */

function escapeHTML(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
