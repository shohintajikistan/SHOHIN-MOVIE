<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071c16">

  <title>SHOHIN MOVIE</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SHOHIN BRAND COLORS — НЕ МЕНЯТЬ -->

  <!-- ================= HEADER ================= -->

  <header class="topbar">

    <div class="brand">
      <div class="brand-logo">SH</div>

      <div class="brand-text">
        <strong>SHOHIN</strong>
        <span>MOVIE</span>
      </div>
    </div>

    <div class="header-actions">

      <button
        class="icon-button search-button"
        id="searchButton"
        type="button"
        aria-label="Поиск"
      >
        ⌕
      </button>

      <button
        class="icon-button menu-button"
        id="menuButton"
        type="button"
        aria-label="Меню"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>


  <!-- ================= SIDE MENU ================= -->

  <div
    class="side-menu-overlay"
    id="sideMenuOverlay"
  ></div>

  <aside
    class="side-menu"
    id="sideMenu"
  >

    <div class="side-menu-header">

      <div class="side-menu-brand">

        <div class="side-menu-logo">
          SH
        </div>

        <div>
          <strong>SHOHIN</strong>
          <span>MOVIE</span>
        </div>

      </div>

      <button
        class="side-menu-close"
        id="sideMenuClose"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="side-menu-content">

      <div class="menu-group">

        <div class="menu-group-title">
          ОСНОВНОЕ
        </div>

        <button
          class="menu-item active"
          data-menu="home"
          type="button"
        >
          <span class="menu-icon">⌂</span>
          <span>Главная</span>
        </button>

        <button
          class="menu-item"
          data-menu="movies"
          type="button"
        >
          <span class="menu-icon">▶</span>
          <span>Фильмы</span>
        </button>

        <button
          class="menu-item"
          data-menu="series"
          type="button"
        >
          <span class="menu-icon">▣</span>
          <span>Сериалы</span>
        </button>

      </div>


      <div class="menu-group">

        <div class="menu-group-title">
          КАТАЛОГ
        </div>

        <button
          class="menu-item"
          data-menu="countries"
          type="button"
        >
          <span class="menu-icon">◎</span>
          <span>Страны</span>
        </button>

        <button
          class="menu-item"
          data-menu="genres"
          type="button"
        >
          <span class="menu-icon">◆</span>
          <span>Жанры</span>
        </button>

        <button
          class="menu-item"
          data-menu="years"
          type="button"
        >
          <span class="menu-icon">▤</span>
          <span>По годам</span>
        </button>

        <button
          class="menu-item"
          data-menu="rating"
          type="button"
        >
          <span class="menu-icon">★</span>
          <span>Рейтинг</span>
        </button>

      </div>


      <div class="menu-group">

        <div class="menu-group-title">
          МОЯ КОЛЛЕКЦИЯ
        </div>

        <button
          class="menu-item"
          data-menu="favorites"
          type="button"
        >
          <span class="menu-icon">♡</span>
          <span>Избранное</span>
        </button>

        <button
          class="menu-item"
          data-menu="recent"
          type="button"
        >
          <span class="menu-icon">◷</span>
          <span>Недавно открытые</span>
        </button>

      </div>


      <div class="menu-group">

        <button
          class="menu-item"
          data-menu="about"
          type="button"
        >
          <span class="menu-icon">i</span>
          <span>О SHOHIN MOVIE</span>
        </button>

      </div>

    </div>


    <div class="side-menu-footer">
      SHOHIN MOVIE
      <span>© 2026</span>
    </div>

  </aside>


  <!-- ================= SEARCH ================= -->

  <section
    class="search-panel"
    id="searchPanel"
  >

    <div class="search-inner">

      <input
        id="searchInput"
        type="search"
        placeholder="Название, страна, жанр..."
        autocomplete="off"
      >

      <button
        id="closeSearch"
        type="button"
      >
        ×
      </button>

    </div>

  </section>


  <!-- ================= MAIN ================= -->

  <main>

    <section class="catalog-section">

      <!-- ТОЛЬКО ДВА ТИПА -->

      <div class="catalog-nav">

        <button
          class="nav-button active"
          data-type="movies"
          type="button"
        >
          Фильмы
        </button>

        <button
          class="nav-button"
          data-type="series"
          type="button"
        >
          Сериалы
        </button>

      </div>


      <!-- ================= CATALOG ================= -->

      <div class="catalog-header">

        <div>

          <h2 id="catalogTitle">
            Фильмы 1980
          </h2>

          <p id="catalogCount">
            Загрузка...
          </p>

        </div>

      </div>


      <!-- ================= MOVIE CARDS ================= -->

      <div
        class="movie-grid"
        id="movieGrid"
      ></div>


      <!-- ================= EMPTY ================= -->

      <div
        class="empty-state"
        id="emptyState"
      >

        <div class="empty-icon">
          ◌
        </div>

        <h3>
          Каталог пуст
        </h3>

        <p>
          Здесь пока нет фильмов.
        </p>

      </div>

    </section>

  </main>


  <!-- ================= LOADER ================= -->

  <div
    class="shohin-loader"
    id="loading"
  >

    <div class="loader-logo">
      SH
    </div>

    <div class="loader-line"></div>

    <strong>
      SHOHIN
    </strong>

    <span>
      MOVIE
    </span>

  </div>


  <!-- ================= MOVIE MODAL ================= -->

  <div
    class="movie-modal"
    id="movieModal"
  >

    <div
      class="modal-overlay"
      id="modalOverlay"
    ></div>

    <div class="modal-card">

      <button
        class="modal-close"
        id="modalClose"
        type="button"
      >
        ×
      </button>

      <div class="modal-poster-wrap">

        <img
          id="modalPoster"
          src=""
          alt=""
        >

      </div>

      <div class="modal-content">

        <div
          class="modal-year"
          id="modalYear"
        ></div>

        <h2 id="modalTitle">
          Фильм
        </h2>

        <div class="modal-main-meta">

          <span id="modalRating">
            ★ —
          </span>

          <span id="modalCountry">
            Страна не указана
          </span>

        </div>

        <div
          class="modal-genres"
          id="modalGenres"
        ></div>

        <p
          class="modal-description"
          id="modalDescription"
        >
          Описание пока не добавлено.
        </p>

      </div>

    </div>

  </div>


  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <strong>
      SHOHIN MOVIE
    </strong>

    <span>
      Learn. Discover. Enjoy.
    </span>

  </footer>


  <!-- ================= SCRIPTS ================= -->

  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>


  <!-- ================= MENU ================= -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const sideMenu =
      document.getElementById("sideMenu");

    const sideMenuOverlay =
      document.getElementById("sideMenuOverlay");

    const sideMenuClose =
      document.getElementById("sideMenuClose");


    function openSideMenu() {

      sideMenu.classList.add("show");

      sideMenuOverlay.classList.add("show");

      document.body.style.overflow = "hidden";

    }


    function closeSideMenu() {

      sideMenu.classList.remove("show");

      sideMenuOverlay.classList.remove("show");

      document.body.style.overflow = "";

    }


    menuButton.addEventListener(
      "click",
      openSideMenu
    );


    sideMenuClose.addEventListener(
      "click",
      closeSideMenu
    );


    sideMenuOverlay.addEventListener(
      "click",
      closeSideMenu
    );


    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {
          closeSideMenu();
        }

      }
    );


    document
      .querySelectorAll(".menu-item")
      .forEach(item => {

        item.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".menu-item")
              .forEach(button => {

                button.classList.remove("active");

              });

            item.classList.add("active");

            closeSideMenu();

          }
        );

      });

  </script>

</body>
</html>
